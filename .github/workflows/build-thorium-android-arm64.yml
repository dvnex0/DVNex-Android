name: DVNex - Build Thorium Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Thorium base for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      THOR_DIR: ${{ github.workspace }}/thorium
      CR_DIR: ${{ github.workspace }}/chromium/src
      DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools
      THORIUM_CHROMIUM_TAG: "150.0.7871.129"

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Install Git and Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-pip curl

      - name: Clone depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"

      - name: Bootstrap depot_tools
        run: |
          "$DEPOT_TOOLS_DIR/ensure_bootstrap"
          test -s "$DEPOT_TOOLS_DIR/python3_bin_reldir.txt"
          python3 --version

      - name: Clone pinned Thorium M150 source
        run: |
          git clone --branch M150 --single-branch https://github.com/Alex313031/thorium.git "$THOR_DIR"
          git -C "$THOR_DIR" checkout a212fdaa6b9de74d08e68390137cf08d8e41017a
          git -C "$THOR_DIR" submodule update --init --recursive

      - name: Preflight pinned Thorium build configuration
        run: |
          python3 -m py_compile "$THOR_DIR/version.py" "$THOR_DIR/setup.py" "$THOR_DIR/build.py"
          test -s "$THOR_DIR/arm/android/arm64_args.gn"
          python3 "$THOR_DIR/build.py" --help > /tmp/dvnex-build-help.txt
          grep -q -- "--expect-os" /tmp/dvnex-build-help.txt
          grep -q -- "--expect-cpu" /tmp/dvnex-build-help.txt
          python3 "$THOR_DIR/setup.py" --help > /tmp/dvnex-setup-help.txt
          grep -q -- "--android" /tmp/dvnex-setup-help.txt
          python3 - "$THOR_DIR/version.py" "$THORIUM_CHROMIUM_TAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          version_source = Path(sys.argv[1]).read_text()
          expected_tag = sys.argv[2]
          match = re.search(
              r'^THORIUM_VERSION\s*=\s*"([^"]+)"',
              version_source,
              re.MULTILINE,
          )
          if not match or match.group(1) != expected_tag:
              actual = match.group(1) if match else "not found"
              raise SystemExit(
                  f"Thorium version mismatch: expected {expected_tag}, found {actual}"
              )
          print(f"Verified Thorium Chromium tag: {expected_tag}")
          PY
          git ls-remote --exit-code --refs https://chromium.googlesource.com/chromium/src.git \
            "refs/tags/$THORIUM_CHROMIUM_TAG"

      - name: Fetch Chromium source without full Git history
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$(dirname "$CR_DIR")"
          cd "$(dirname "$CR_DIR")"
          fetch --nohooks --no-history chromium

      - name: Configure Chromium checkout for Android
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path("chromium/.gclient")
          source = path.read_text()
          tree = ast.parse(source)
          solutions = next(
              node.value for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "solutions" for t in node.targets)
          )
          solution = next(
              item for item in solutions.elts
              if isinstance(item, ast.Dict)
              and any(
                  isinstance(k, ast.Constant) and k.value == "name"
                  and isinstance(v, ast.Constant) and v.value == "src"
                  for k, v in zip(item.keys, item.values)
              )
          )
          custom_vars = next(
              (v for k, v in zip(solution.keys, solution.values)
               if isinstance(k, ast.Constant) and k.value == "custom_vars"),
              None,
          )
          lines = source.splitlines(keepends=True)

          def absolute_offset(line, column):
              return sum(len(x) for x in lines[:line - 1]) + column

          if custom_vars is None:
              pos = absolute_offset(solution.end_lineno, solution.end_col_offset - 1)
              before = source[:pos].rstrip()
              separator = "" if before.endswith(",") else ","
              source = source[:pos] + separator + '\n        "custom_vars": {"checkout_pgo_profiles": True},' + source[pos:]
          else:
              if not isinstance(custom_vars, ast.Dict):
                  raise SystemExit("Unexpected custom_vars format in .gclient")
              has_pgo = any(
                  isinstance(k, ast.Constant) and k.value == "checkout_pgo_profiles"
                  for k in custom_vars.keys
              )
              if not has_pgo:
                  pos = absolute_offset(custom_vars.end_lineno, custom_vars.end_col_offset - 1)
                  before = source[:pos].rstrip()
                  separator = "" if before.endswith(",") or before.endswith("{") else ","
                  source = source[:pos] + separator + '"checkout_pgo_profiles": True' + source[pos:]

          if 'target_os = ["android"]' not in source and "target_os = ['android']" not in source:
              source += '\ntarget_os = ["android"]\n'

          ast.parse(source)
          path.write_text(source)
          print(source)
          PY
          git -C "$CR_DIR" fetch --depth=1 --no-tags origin \
            "refs/tags/${THORIUM_CHROMIUM_TAG}:refs/tags/${THORIUM_CHROMIUM_TAG}"
          git -C "$CR_DIR" show-ref --verify --quiet "refs/tags/${THORIUM_CHROMIUM_TAG}"

      - name: Install Chromium Linux build dependencies
        working-directory: ${{ env.CR_DIR }}
        run: |
          ./build/install-build-deps.sh --arm --chromeos-fonts

      - name: Pin Chromium revision and download Android dependencies
        working-directory: ${{ env.THOR_DIR }}
        run: |
          python3 version.py
          df -h /

      - name: Apply Thorium Android patches and resources
        working-directory: ${{ env.THOR_DIR }}
        run: |
          python3 setup.py --android

      - name: Fix Thorium ThinLTO GN scope for Android
        working-directory: ${{ env.CR_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/config/compiler/BUILD.gn")
          source = path.read_text()

          old_assignment = """    _thorium_x86_thinlto =
        is_full_optimization_build && lto_opt_level == 2 &&
        (is_win || is_linux) && (current_cpu == "x86" || current_cpu == "x64")

    if (is_win) {
"""
          new_assignment = """    if (is_win) {
      _thorium_x86_thinlto =
          is_full_optimization_build && lto_opt_level == 2 &&
          (current_cpu == "x86" || current_cpu == "x64")
"""
          if source.count(old_assignment) != 1:
              raise SystemExit(
                  "Expected exactly one Thorium ThinLTO assignment before "
                  "the Windows branch; source does not match the audited patch."
              )
          source = source.replace(old_assignment, new_assignment, 1)

          old_linux = """    } else if (is_linux) {
      ldflags = [ "-Wl,--lto-O" + lto_opt_level ]
"""
          new_linux = """    } else if (is_linux) {
      _thorium_x86_thinlto =
          is_full_optimization_build && lto_opt_level == 2 &&
          (current_cpu == "x86" || current_cpu == "x64")
      ldflags = [ "-Wl,--lto-O" + lto_opt_level ]
"""
          if source.count(old_linux) != 1:
              raise SystemExit(
                  "Expected exactly one Thorium Linux ThinLTO branch; "
                  "source does not match the audited patch."
              )
          source = source.replace(old_linux, new_linux, 1)

          expected = 'is_full_optimization_build && lto_opt_level == 2'
          if source.count(expected) != 2:
              raise SystemExit("ThinLTO branch validation failed.")
          path.write_text(source)
          print("Fixed Thorium ThinLTO temporary-variable scope for Android.")
          PY

      - name: Configure ARM64 release build
        working-directory: ${{ env.CR_DIR }}
        run: |
          mkdir -p out/thorium
          cp "$THOR_DIR/arm/android/arm64_args.gn" out/thorium/args.gn
          gn gen out/thorium
          gn args out/thorium --list > /tmp/dvnex-gn-args.txt
          grep -E 'target_os|target_cpu|is_official_build|is_debug' out/thorium/args.gn || true
          df -h /

      - name: Compile Thorium Android ARM64 APK targets
        working-directory: ${{ env.THOR_DIR }}
        run: |
          python3 build.py --expect-os android --expect-cpu arm64 -j 2

      - name: Show APK outputs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== APK FILES ==="
          if [ -d "$CR_DIR/out/thorium" ]; then
            find "$CR_DIR/out/thorium" -type f -name '*.apk' -print || true
          else
            echo "Chromium checkout/build directory does not exist: $CR_DIR"
          fi
          echo "=== CHECKOUT STATUS ==="
          if [ -d "$CR_DIR" ]; then
            echo "Chromium source checkout exists."
          else
            echo "Chromium source checkout was not created."
          fi
          echo "=== DISK ==="
          df -h /

      - name: Upload Android APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thorium-android-arm64-base
          path: ${{ env.CR_DIR }}/out/thorium/**/*.apk
          if-no-files-found: error
          retention-days: 7
