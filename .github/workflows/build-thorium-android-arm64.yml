name: DVNex - Build Thorium Android ARM64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Thorium base for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout DVNex build scripts
        uses: actions/checkout@v4

      - name: Compile Thorium Android ARM64
        run: bash .github/scripts/build-thorium-android-arm64.sh

      - name: Show APK outputs
        if: always()
        run: |
          echo "=== APK FILES ==="
          if [ -d "chromium/src/out/thorium" ]; then
            find chromium/src/out/thorium -type f -name '*.apk' -print || true
          else
            echo "Chromium build directory does not exist."
          fi
          echo "=== DISK ==="
          df -h /

      - name: Upload Android APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thorium-android-arm64-base
          path: chromium/src/out/thorium/**/*.apk
          if-no-files-found: error
          retention-days: 7
