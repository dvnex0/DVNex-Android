version: 2.1

jobs:
  build-thorium-android-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout

      # A new pipeline starts with an empty workspace. Re-running a failed
      # job in the same workflow restores the most recent saved build state.
      - attach_workspace:
          at: /home/circleci/project

      - run:
          name: Resume Thorium Android ARM64 build
          command: |
            set -Eeuo pipefail
            mkdir -p chromium thorium depot_tools
            echo "=== Restored build state ==="
            for path in chromium thorium depot_tools; do
              if [ -d "$path" ]; then
                du -sh "$path" || true
              fi
            done
            df -h /
            bash .github/scripts/build-thorium-android-arm64.sh
          no_output_timeout: 45m
          teardown:
            # This runs after success, failure, cancellation, or the plan's
            # job runtime limit. CircleCI allows up to 10 minutes for teardown.
            - persist_to_workspace:
                root: /home/circleci/project
                paths:
                  - chromium
                  - thorium
                  - depot_tools

      - run:
          name: Collect completed Android APK
          command: |
            set -Eeuo pipefail
            mkdir -p /tmp/dvnex-artifacts
            mapfile -d '' apks < <(find chromium/src/out/thorium -type f -name '*.apk' -print0)
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "No APK was generated by the completed build."
              exit 1
            fi
            cp "${apks[@]}" /tmp/dvnex-artifacts/
            ls -lh /tmp/dvnex-artifacts

      - store_artifacts:
          path: /tmp/dvnex-artifacts
          destination: thorium-android-arm64

workflows:
  build:
    jobs:
      - build-thorium-android-arm64
