version: 2.1

jobs:
  build-dvnex-chromium-arm64:
    machine:
      image: ubuntu-2404:current
    # CircleCI Free exposes this Linux VM class for public open-source builds.
    # 4 vCPU, about 15 GB RAM and 150 GB disk.
    resource_class: large
    working_directory: /home/circleci/project
    steps:
      - checkout

      # Re-running this failed job in the SAME workflow attaches its last
      # persisted Chromium checkout and continues the incremental Ninja build.
      - attach_workspace:
          at: /home/circleci/project

      - run:
          name: Prepare free Linux runner and resume DVNex Chromium ARM64
          command: |
            set -Eeuo pipefail

            echo "=== Free space on CircleCI Linux VM ==="
            df -h /
            df -h /home/circleci/project

            # Remove large preinstalled SDK/toolchains not used by this build.
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf /usr/local/.ghcup
            sudo apt-get clean

            echo "=== Restored source and build state ==="
            for path in chromium cromite depot_tools; do
              if [ -d "$path" ]; then
                du -sh "$path" || true
              else
                echo "$path: not present yet"
              fi
            done
            if [ -f .dvnex-patches-applied ]; then
              echo "Cromite patch-series marker: present"
            else
              echo "Cromite patch-series marker: not present"
            fi
            df -h /

            # 2 jobs is conservative for the 15 GB RAM runner.
            WORKSPACE=/home/circleci/project JOBS=2 \
              bash scripts/build-dvnex-cromium-arm64.sh
          no_output_timeout: 50m
          teardown:
            # CircleCI Free stops an individual job after one hour. Teardown
            # persists the working tree so "Rerun job" can resume the same
            # workflow rather than starting a fresh Chromium checkout.
            - persist_to_workspace:
                root: /home/circleci/project
                paths:
                  - chromium
                  - cromite
                  - depot_tools
                  - .dvnex-patches-applied

      - run:
          name: Collect the completed DVNex Chromium APK
          command: |
            set -Eeuo pipefail
            mkdir -p /tmp/dvnex-artifacts
            APK="$(find chromium/src/out/dvnex-arm64 -type f -name 'ChromePublic.apk' -print -quit)"
            if [ -z "$APK" ]; then
              APK="$(find chromium/src/out/dvnex-arm64 -type f -name '*.apk' -print -quit)"
            fi
            if [ -z "$APK" ]; then
              echo "No APK found. The Chromium build did not complete."
              exit 1
            fi
            cp "$APK" /tmp/dvnex-artifacts/
            sha256sum /tmp/dvnex-artifacts/*
            ls -lh /tmp/dvnex-artifacts

      - store_artifacts:
          path: /tmp/dvnex-artifacts
          destination: dvnex-new3-chromium-arm64

workflows:
  build:
    jobs:
      - build-dvnex-chromium-arm64
